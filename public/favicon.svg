<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#8b5cf6" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Styled Graduation Cap & AI Node Fusion -->
  <g filter="url(#shadow)">
    <!-- Mortarboard Diamond (Top part) -->
    <path d="M256 96 L448 192 L256 288 L64 192 Z" fill="url(#capGrad)" />

    <!-- Cap Base (Bottom part) -->
    <path d="M160 256 V330 C160 365, 208 396, 256 396 C304 396, 352 365, 352 330 V256 L256 304 Z" fill="url(#glowGrad)" opacity="0.9" />

    <!-- Tassel -->
    <path d="M448 192 L464 300 C464 320, 452 330, 436 330 C428 330, 420 324, 420 312 Z" fill="#22d3ee" />
    <circle cx="448" cy="192" r="8" fill="#22d3ee" />

    <!-- AI Nodes and Lines on the Diamond Top -->
    <!-- Connection lines -->
    <line x1="256" y1="192" x2="160" y2="160" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="256" y1="192" x2="352" y2="160" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="256" y1="192" x2="256" y2="256" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <line x1="256" y1="192" x2="256" y2="128" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    
    <line x1="160" y1="160" x2="256" y2="128" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="352" y1="160" x2="256" y2="128" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="160" y1="160" x2="256" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    <line x1="352" y1="160" x2="256" y2="256" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.5" />

    <!-- Nodes (circles) -->
    <circle cx="256" cy="192" r="16" fill="#ffffff" stroke="#a855f7" stroke-width="4" />
    <circle cx="160" cy="160" r="10" fill="#22d3ee" />
    <circle cx="352" cy="160" r="10" fill="#22d3ee" />
    <circle cx="256" cy="128" r="10" fill="#818cf8" />
    <circle cx="256" cy="256" r="10" fill="#c084fc" />
  </g>
</svg>